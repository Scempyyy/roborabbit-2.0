<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1826"/>
      <stop offset="70%" stop-color="#040b12"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Metallic Gradients -->
    <linearGradient id="earLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162e45"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#070e17"/>
    </linearGradient>

    <linearGradient id="earRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162e45"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#070e17"/>
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3550"/>
      <stop offset="60%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>

    <radialGradient id="arcCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7df9ff"/>
      <stop offset="70%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#005580"/>
    </radialGradient>

    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </radialGradient>
  </defs>

  <!-- Base Plate (Squircle with 120px radius) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Border -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8 12" stroke-opacity="0.2"/>

  <!-- Tactical HUD Background Calibration Rings -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="14 10"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 8"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 472 70 L 472 40 L 442 40" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 442 L 40 472 L 70 472" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 472 442 L 472 472 L 442 472" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= RABBIT MECHA EARS ================= -->
  <!-- Left Ear Outer Plate -->
  <path d="M 175 250 L 140 130 L 165 42 L 205 100 L 218 230 Z" 
        fill="url(#earLeftGrad)" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left Ear Inner Energy Channel -->
  <path d="M 166 126 L 176 68 L 194 106 L 186 210 Z" 
        fill="#040b12" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)"/>
  <line x1="181" y1="92" x2="183" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Right Ear Outer Plate -->
  <path d="M 337 250 L 372 130 L 347 42 L 307 100 L 294 230 Z" 
        fill="url(#earRightGrad)" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right Ear Inner Energy Channel -->
  <path d="M 346 126 L 336 68 L 318 106 L 326 210 Z" 
        fill="#040b12" stroke="#f59e0b" stroke-width="2" filter="url(#glowAmber)"/>
  <line x1="331" y1="92" x2="329" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ================= MECHA RABBIT HELMET FACE ================= -->
  <!-- Face Shield Outer Polygon -->
  <polygon points="256,170 340,210 326,306 256,346 186,306 172,210" 
           fill="url(#faceGrad)" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Forehead Crest & Sensor Node -->
  <polygon points="256,180 278,212 256,226 234,212" fill="#0c1926" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="256" cy="208" r="4" fill="#00ff73" filter="url(#glowCyan)"/>

  <!-- Angular Cyber Visor Eyes -->
  <!-- Left Eye -->
  <polygon points="204,242 238,248 230,262 208,256" fill="url(#eyeGrad)" filter="url(#glowCyan)"/>
  <!-- Right Eye -->
  <polygon points="308,242 274,248 282,262 304,256" fill="url(#eyeGrad)" filter="url(#glowCyan)"/>

  <!-- Cheeks Air Vents -->
  <line x1="192" y1="282" x2="216" y2="294" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="196" y1="290" x2="220" y2="302" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="320" y1="282" x2="296" y2="294" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="316" y1="290" x2="292" y2="302" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Chin Connector -->
  <line x1="256" y1="324" x2="256" y2="356" stroke="#00f0ff" stroke-width="3"/>

  <!-- ================= CHEST ARC REACTOR ================= -->
  <!-- Arc Outer Housing Ring -->
  <circle cx="256" cy="406" r="64" fill="#07121c" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="256" cy="406" r="54" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- 8 Arc Reactor Segment Nodes -->
  <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="356" x2="256" y2="368"/>
    <line x1="256" y1="444" x2="256" y2="456"/>
    <line x1="206" y1="406" x2="218" y2="406"/>
    <line x1="294" y1="406" x2="306" y2="406"/>
    <line x1="221" y1="371" x2="229" y2="379"/>
    <line x1="283" y1="433" x2="291" y2="441"/>
    <line x1="221" y1="441" x2="229" y2="433"/>
    <line x1="283" y1="379" x2="291" y2="371"/>
  </g>

  <!-- Arc Core Inner Ring & Radiant Center -->
  <circle cx="256" cy="406" r="34" fill="#03080e" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="256" cy="406" r="22" fill="url(#arcCoreGrad)" filter="url(#glowCyan)"/>
  <circle cx="256" cy="406" r="9" fill="#ffffff"/>

  <!-- Glowing Energy Radiance Beam from Arc to Chin -->
  <line x1="256" y1="346" x2="256" y2="356" stroke="#7df9ff" stroke-width="4" filter="url(#glowCyan)"/>
</svg>